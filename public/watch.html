<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>banzaipiratin</title><link rel="icon" href="logo.webp"><link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="signal.js"></script></head>
<body><main>
<img class="logo" src="logo.webp" alt="Banzai Roller Derby">
<h1>Champs 2026</h1>
<div class="badge-row"><span id="badge" class="badge">Conectando…</span></div>
<p class="sub" id="status">&nbsp;</p>
<div class="card" id="gate" hidden>
  <div class="row"><input id="code" placeholder="Código"><button id="go">Entrar</button></div>
</div>
<div class="card">
  <div class="player">
    <video id="v" autoplay playsinline controls muted></video>
    <button id="cast" class="castbtn" hidden title="Transmitir a TV (Chromecast)" aria-label="Transmitir a TV">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M21 3H3a2 2 0 0 0-2 2v3h2V5h18v14h-7v2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM1 18v3h3a3 3 0 0 0-3-3zm0-4v2a5 5 0 0 1 5 5h2a7 7 0 0 0-7-7zm0-4v2a9 9 0 0 1 9 9h2A11 11 0 0 0 1 10z"/></svg>
    </button>
  </div>
</div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const setBadge = (t, live) => { $('badge').textContent = t; $('badge').classList.toggle('live', !!live); };
const isTV = new URLSearchParams(location.search).has('tv');   // modo pantalla de TV (Chromecast)
if (isTV) { document.body.classList.add('tv'); $('v').controls = false; $('v').muted = false; }
let casting = false;
let sig, pc, code, pending = 0, tries = 0, vid = rid();
const vEl = $('v'); let unmutedAt = 0, lastT = -1, stuck = 0;

// Al sacar el silencio, algunos celulares pausan el video: lo reanudamos.
vEl.addEventListener('volumechange', () => {
  if (vEl.muted || !vEl.srcObject) return;
  unmutedAt = Date.now();
  setTimeout(() => vEl.paused && vEl.play().catch(() => { vEl.muted = true; }), 0);
});
vEl.addEventListener('pause', () => {
  if (Date.now() - unmutedAt < 1500 && vEl.srcObject) vEl.play().catch(() => { vEl.muted = true; });
});
// Si el video queda congelado, volvemos a conectarlo al stream.
setInterval(() => {
  if (!vEl.srcObject || vEl.paused || document.hidden) { stuck = 0; lastT = -1; return; }
  if (vEl.currentTime === lastT) { if (++stuck >= 3) { const st = vEl.srcObject; vEl.srcObject = null; vEl.srcObject = st; vEl.play().catch(() => { vEl.muted = true; vEl.play().catch(() => {}); }); stuck = 0; } }
  else { stuck = 0; lastT = vEl.currentTime; }
}, 2000);

function hello() {
  if (casting) return;
  if (Date.now() - pending < 12000) return;   // ya pedí hace poco
  pending = Date.now(); setBadge('Conectando…');
  sig.send({ t: 'hello', v: vid }).catch(() => setBadge('Sin conexión'));
}
function drop() { pc && pc.close(); pc = null; $('v').srcObject = null; }

async function onOffer(m) {
  drop(); pending = 0;
  pc = new RTCPeerConnection(ICE); const me = pc;
  pc.ontrack = (ev) => {
    if (vEl.srcObject === ev.streams[0]) return;
    vEl.srcObject = ev.streams[0];
    vEl.play().catch(() => { vEl.muted = true; vEl.play().catch(() => {}); });  // si el navegador bloquea el sonido, arranca en mudo
  };
  pc.onconnectionstatechange = () => {
    if (me !== pc) return;
    if (me.connectionState === 'connected') { tries = 0; setBadge('EN VIVO', true); }
    else if (['failed', 'disconnected', 'closed'].includes(me.connectionState)) {
      drop(); setBadge('Esperando transmisión');
      if (tries++ < 5) setTimeout(hello, 3000);
    }
  };
  await pc.setRemoteDescription({ type: 'offer', sdp: m.sdp });
  await pc.setLocalDescription(await pc.createAnswer());
  await gather(pc);
  sig.send({ t: 'answer', v: vid, b: m.b, sdp: pc.localDescription.sdp }).catch(() => setBadge('Sin conexión'));
}

function start(c) {
  code = c.trim().toLowerCase().replace(/[^a-z0-9]/g, ''); if (!code) return;
  $('gate').hidden = true; setBadge('Conectando…');
  sig = new Signal(code, (m) => {
    if (m.t === 'live') { if (!pc) hello(); }
    else if (m.t === 'bye') { drop(); pending = 0; setBadge('Esperando transmisión'); }
    else if (m.t === 'offer' && m.v === vid) onOffer(m);
  }, {
    since: '9m',
    onstatus: (st) => { if (st === 'error') setBadge('Reconectando…'); else if (!pc) setBadge('Esperando transmisión'); },
  });
}
$('go').onclick = () => start($('code').value);
start(location.hash.slice(1) || window.DEFAULT_CODE);

// Botón de Chromecast: el Chromecast abre esta misma página en modo TV y se conecta solo.
if (!isTV && 'PresentationRequest' in window) {
  try {
    const req = new PresentationRequest([new URL('watch.html?tv=1#' + code, location.href).href]);
    const btn = $('cast');
    req.getAvailability().then((av) => {
      const upd = () => (btn.hidden = !av.value); upd(); av.onchange = upd;
    }).catch(() => {});
    const resume = () => { casting = false; btn.classList.remove('on'); pending = 0; hello(); };
    btn.onclick = () => req.start().then((conn) => {
      casting = true; btn.classList.add('on'); drop(); setBadge('Transmitiendo a la TV');
      conn.onterminate = conn.onclose = resume;
    }).catch(() => {});
  } catch {}
}
</script></body></html>
