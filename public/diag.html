<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<h1>Diagnóstico de conexión</h1>
<p class="sub">Esperá unos segundos y mandame una captura o copiá el resultado.</p>
<div class="card"><pre id="out" style="white-space:pre-wrap;margin:0;font-size:.95rem">Probando…</pre>
<div class="row"><button id="copy" class="sec">Copiar resultado</button></div></div>
</main>
<script>
const out = []; const show = () => (document.getElementById('out').textContent = out.join('\n'));
const add = (t) => { out.push(t); show(); };
const ok = (b) => (b ? '✅' : '❌');
document.getElementById('copy').onclick = () => navigator.clipboard.writeText(out.join('\n'));

function sse() {
  return new Promise((res) => {
    let done = false; const t0 = Date.now();
    const finish = (m, good) => { if (done) return; done = true; add(`${ok(good)} Señalización (ntfy.sh, solo HTTPS): ${m}`); es.close(); res(); };
    const es = new EventSource('https://ntfy.sh/banzai-diag-' + Math.random().toString(36).slice(2, 10) + '/sse');
    es.onopen = () => finish('conectó (' + (Date.now() - t0) + ' ms)', true);
    es.onerror = () => finish('no se pudo conectar', false);
    setTimeout(() => finish('sin respuesta en 8 s', false), 8000);
  });
}
function stun() {
  return new Promise((res) => {
    const types = new Set(); const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    pc.createDataChannel('x');
    pc.onicecandidate = (e) => { if (e.candidate) types.add(e.candidate.type); };
    pc.createOffer().then((o) => pc.setLocalDescription(o));
    setTimeout(() => { pc.close(); add(`${ok(types.has('srflx'))} STUN (Google): ${types.has('srflx') ? 'ok' : 'no responde (tu red bloquea WebRTC hacia Internet)'} [${[...types].join(', ') || 'sin candidatos'}]`); res(); }, 5000);
  });
}
(async () => {
  add('Navegador: ' + navigator.userAgent);
  add('Pantalla compartida disponible: ' + (navigator.mediaDevices?.getDisplayMedia ? 'sí' : 'no'));
  try { add('Código guardado: ' + (localStorage.getItem('code') || '(ninguno)')); } catch { add('Código guardado: (localStorage bloqueado)'); }
  await sse(); await stun(); add('Fin.');
})();
</script></body></html>
